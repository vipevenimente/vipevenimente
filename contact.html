<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | VIP Events Solutions</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin:0;
  background:#0d0d0d;
  color:#fff;
}

header {
  text-align:center;
  padding:20px;
}

.nav {
  text-align:center;
  padding:20px;
}

.nav a {
  display:inline-block;
  margin:8px;
  padding:12px 20px;
  border-radius:30px;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(145deg,#1a1a1a,#222);
  border:1px solid #333;
}

.nav a:first-child {
  background:linear-gradient(145deg,#ff9800,#cc7a00);
  color:#000;
  border:none;
}

section {
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

.box {
  background:#111;
  padding:25px;
  border-radius:12px;
  border:1px solid #222;
}

input, textarea {
  width:100%;
  padding:12px;
  margin-top:10px;
  margin-bottom:15px;
  border-radius:8px;
  border:none;
  outline:none;
}

textarea {
  min-height:140px;
  resize:vertical;
}

button {
  background:#ff9800;
  color:#000;
  padding:12px 20px;
  border:none;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

button:hover {
  background:#cc7a00;
}

/* mesaj succes */
.success {
  display:none;
  text-align:center;
  background:#1a1a1a;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  border:1px solid #333;
  color:#4caf50;
}
</style>
</head>

<body>

<header>
  <h1>Contact VIP Events Solutions</h1>
</header>

<!-- MENIU -->
<div class="nav">
  <a href="index.html">Home</a>
  <a href="dj-nunta.html">DJ Nuntă</a>
  <a href="Live.html">Band Live</a>
  <a href="foto-video.html">Foto Video</a>
  <a href="cabina-foto.html">Cabină Foto</a>
  <a href="efecte-speciale.html">Efecte</a>
  <a href="decor.html">Decoruri</a>
  <a href="recenzii.html">Recenzii</a>
  <a href="contact.html">Contact</a>
</div>

<section>

<div class="box">

  <h2>Trimite-ne un mesaj</h2>

  <!-- mesaj succes (bonus) -->
  <div id="success" class="success">
    ✔ Mesaj trimis cu succes! Îți răspundem în cel mai scurt timp.
  </div>

  <!-- FORMULAR FORMSPREE -->
  <form id="contactForm" action="https://formspree.io/f/mbdbnpap" method="POST">

    <input type="text" name="nume" placeholder="Nume și prenume" required>

    <input type="email" name="email" placeholder="Adresa de email" required>

    <input type="tel" name="telefon" placeholder="Număr de telefon">

    <textarea name="mesaj" placeholder="Mesajul tău..." required></textarea>

    <!-- BONUS anti-spam (honeypot) -->
    <input type="text" name="_gotcha" style="display:none">

    <!-- redirect după trimitere (BONUS) -->
    <input type="hidden" name="_redirect" value="https://vipevenimente.ro/contact.html">

    <button type="submit">Trimite mesaj</button>

  </form>

</div>

</section>

<!-- BONUS SCRIPT: afișează mesaj fără refresh -->
<script>
document.getElementById("contactForm").addEventListener("submit", function(){
    document.getElementById("success").style.display = "block";
});
</script>

</body>
</html>
